<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务记录 - TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="container header-inner">
            <div class="logo">
                <span class="logo-icon">&#9745;</span>
                <span class="logo-text">TaskFlow</span>
            </div>
            <nav class="nav">
                <button class="nav-btn active" data-view="board">看板</button>
                <button class="nav-btn" data-view="list">列表</button>
                <button class="nav-btn" data-view="stats">统计</button>
            </nav>
            <div class="header-actions">
                <button class="btn btn-primary" id="addTaskBtn">+ 新建任务</button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main">
        <div class="container">
            <!-- 筛选和搜索栏 -->
            <section class="toolbar">
                <div class="search-box">
                    <span class="search-icon">&#128269;</span>
                    <input type="text" id="searchInput" placeholder="搜索任务..." class="search-input">
                </div>
                <div class="filters">
                    <select id="filterPriority" class="filter-select">
                        <option value="all">全部优先级</option>
                        <option value="high">高优先级</option>
                        <option value="medium">中优先级</option>
                        <option value="low">低优先级</option>
                    </select>
                    <select id="filterCategory" class="filter-select">
                        <option value="all">全部类别</option>
                        <option value="work">工作</option>
                        <option value="personal">个人</option>
                        <option value="study">学习</option>
                        <option value="other">其他</option>
                    </select>
                </div>
            </section>

            <!-- 看板视图 -->
            <section class="view" id="boardView">
                <div class="board">
                    <div class="board-column" data-status="todo">
                        <div class="column-header">
                            <span class="column-dot dot-todo"></span>
                            <h3>待办</h3>
                            <span class="column-count" id="countTodo">0</span>
                        </div>
                        <div class="column-body" id="todoList"></div>
                    </div>
                    <div class="board-column" data-status="inprogress">
                        <div class="column-header">
                            <span class="column-dot dot-inprogress"></span>
                            <h3>进行中</h3>
                            <span class="column-count" id="countInprogress">0</span>
                        </div>
                        <div class="column-body" id="inprogressList"></div>
                    </div>
                    <div class="board-column" data-status="done">
                        <div class="column-header">
                            <span class="column-dot dot-done"></span>
                            <h3>已完成</h3>
                            <span class="column-count" id="countDone">0</span>
                        </div>
                        <div class="column-body" id="doneList"></div>
                    </div>
                </div>
            </section>

            <!-- 列表视图 -->
            <section class="view hidden" id="listView">
                <div class="list-table">
                    <div class="list-header">
                        <span class="list-col col-check"></span>
                        <span class="list-col col-name">任务名称</span>
                        <span class="list-col col-category">类别</span>
                        <span class="list-col col-priority">优先级</span>
                        <span class="list-col col-status">状态</span>
                        <span class="list-col col-date">截止日期</span>
                        <span class="list-col col-actions">操作</span>
                    </div>
                    <div class="list-body" id="listBody"></div>
                </div>
            </section>

            <!-- 统计视图 -->
            <section class="view hidden" id="statsView">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="statTotal">0</div>
                        <div class="stat-label">总任务数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statTodo">0</div>
                        <div class="stat-label">待办</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statInprogress">0</div>
                        <div class="stat-label">进行中</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statDone">0</div>
                        <div class="stat-label">已完成</div>
                    </div>
                </div>
                <div class="chart-container">
                    <h3 class="chart-title">完成率</h3>
                    <div class="progress-bar-wrapper">
                        <div class="progress-bar" id="completionBar"></div>
                    </div>
                    <p class="chart-percent" id="completionPercent">0%</p>
                </div>
                <div class="chart-container">
                    <h3 class="chart-title">类别分布</h3>
                    <div class="category-bars" id="categoryBars"></div>
                </div>
            </section>
        </div>
    </main>

    <!-- 新建/编辑任务模态框 -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">新建任务</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <form class="modal-form" id="taskForm">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label for="taskName">任务名称 <span class="required">*</span></label>
                    <input type="text" id="taskName" placeholder="输入任务名称" required>
                </div>
                <div class="form-group">
                    <label for="taskDesc">任务描述</label>
                    <textarea id="taskDesc" placeholder="输入任务描述（可选）" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskCategory">类别</label>
                        <select id="taskCategory">
                            <option value="work">工作</option>
                            <option value="personal">个人</option>
                            <option value="study">学习</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">优先级</label>
                        <select id="taskPriority">
                            <option value="low">低</option>
                            <option value="medium">中</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskStatus">状态</label>
                        <select id="taskStatus">
                            <option value="todo">待办</option>
                            <option value="inprogress">进行中</option>
                            <option value="done">已完成</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskDueDate">截止日期</label>
                        <input type="date" id="taskDueDate">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 确认删除模态框 -->
    <div class="modal-overlay hidden" id="deleteOverlay">
        <div class="modal modal-small">
            <div class="modal-header">
                <h2>确认删除</h2>
                <button class="modal-close" id="deleteClose">&times;</button>
            </div>
            <div class="modal-body">
                <p>确定要删除这个任务吗？此操作不可撤销。</p>
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" id="deleteCancelBtn">取消</button>
                <button class="btn btn-danger" id="deleteConfirmBtn">删除</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
