<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - 任务记录</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="container header-inner">
            <div class="logo">
                <span class="logo-icon">&#9745;</span>
                <span class="logo-text">TaskFlow</span>
            </div>
            <nav class="nav">
                <button class="nav-btn active" data-view="board">看板视图</button>
                <button class="nav-btn" data-view="list">列表视图</button>
                <button class="nav-btn" data-view="stats">统计概览</button>
            </nav>
            <div class="header-actions">
                <button class="btn btn-primary" id="addTaskBtn">+ 新建任务</button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main">
        <div class="container">
            <!-- 筛选栏 -->
            <section class="filter-bar">
                <div class="search-box">
                    <span class="search-icon">&#128269;</span>
                    <input type="text" id="searchInput" placeholder="搜索任务..." class="search-input">
                </div>
                <div class="filter-group">
                    <select id="filterPriority" class="filter-select">
                        <option value="all">全部优先级</option>
                        <option value="high">高优先级</option>
                        <option value="medium">中优先级</option>
                        <option value="low">低优先级</option>
                    </select>
                    <select id="filterCategory" class="filter-select">
                        <option value="all">全部分类</option>
                        <option value="work">工作</option>
                        <option value="personal">个人</option>
                        <option value="study">学习</option>
                        <option value="other">其他</option>
                    </select>
                </div>
            </section>

            <!-- 看板视图 -->
            <section class="view" id="boardView">
                <div class="board">
                    <div class="board-column" data-status="todo">
                        <div class="column-header">
                            <span class="column-dot dot-todo"></span>
                            <h3>待办</h3>
                            <span class="column-count" id="countTodo">0</span>
                        </div>
                        <div class="column-tasks" id="todoTasks"></div>
                    </div>
                    <div class="board-column" data-status="inprogress">
                        <div class="column-header">
                            <span class="column-dot dot-inprogress"></span>
                            <h3>进行中</h3>
                            <span class="column-count" id="countInprogress">0</span>
                        </div>
                        <div class="column-tasks" id="inprogressTasks"></div>
                    </div>
                    <div class="board-column" data-status="done">
                        <div class="column-header">
                            <span class="column-dot dot-done"></span>
                            <h3>已完成</h3>
                            <span class="column-count" id="countDone">0</span>
                        </div>
                        <div class="column-tasks" id="doneTasks"></div>
                    </div>
                </div>
            </section>

            <!-- 列表视图 -->
            <section class="view hidden" id="listView">
                <div class="list-table-wrapper">
                    <table class="list-table">
                        <thead>
                            <tr>
                                <th>任务名称</th>
                                <th>分类</th>
                                <th>优先级</th>
                                <th>截止日期</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="listTableBody">
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 统计视图 -->
            <section class="view hidden" id="statsView">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="statTotal">0</div>
                        <div class="stat-label">总任务数</div>
                    </div>
                    <div class="stat-card stat-todo">
                        <div class="stat-number" id="statTodo">0</div>
                        <div class="stat-label">待办</div>
                    </div>
                    <div class="stat-card stat-inprogress">
                        <div class="stat-number" id="statInprogress">0</div>
                        <div class="stat-label">进行中</div>
                    </div>
                    <div class="stat-card stat-done">
                        <div class="stat-number" id="statDone">0</div>
                        <div class="stat-label">已完成</div>
                    </div>
                </div>
                <div class="chart-section">
                    <h3 class="chart-title">完成率</h3>
                    <div class="progress-bar-wrapper">
                        <div class="progress-bar" id="completionBar" style="width: 0%"></div>
                    </div>
                    <p class="progress-text" id="completionText">0%</p>
                </div>
                <div class="chart-section">
                    <h3 class="chart-title">分类分布</h3>
                    <div class="category-bars" id="categoryBars"></div>
                </div>
            </section>
        </div>
    </main>

    <!-- 新建/编辑任务模态框 -->
    <div class="modal-overlay hidden" id="taskModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">新建任务</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <form id="taskForm" class="task-form">
                <div class="form-group">
                    <label for="taskTitle">任务名称 <span class="required">*</span></label>
                    <input type="text" id="taskTitle" placeholder="输入任务名称" required>
                </div>
                <div class="form-group">
                    <label for="taskDesc">任务描述</label>
                    <textarea id="taskDesc" placeholder="输入任务描述..." rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskCategory">分类</label>
                        <select id="taskCategory">
                            <option value="work">工作</option>
                            <option value="personal">个人</option>
                            <option value="study">学习</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">优先级</label>
                        <select id="taskPriority">
                            <option value="low">低</option>
                            <option value="medium">中</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskDueDate">截止日期</label>
                        <input type="date" id="taskDueDate">
                    </div>
                    <div class="form-group">
                        <label for="taskStatus">状态</label>
                        <select id="taskStatus">
                            <option value="todo">待办</option>
                            <option value="inprogress">进行中</option>
                            <option value="done">已完成</option>
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">创建任务</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 删除确认模态框 -->
    <div class="modal-overlay hidden" id="deleteModal">
        <div class="modal modal-small">
            <div class="modal-header">
                <h2>确认删除</h2>
                <button class="modal-close" id="deleteModalClose">&times;</button>
            </div>
            <p class="delete-msg">确定要删除这个任务吗？此操作无法撤销。</p>
            <div class="form-actions">
                <button class="btn btn-secondary" id="cancelDeleteBtn">取消</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">删除</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
